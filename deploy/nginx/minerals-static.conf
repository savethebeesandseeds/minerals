# Install as /etc/nginx/conf.d/default.conf in an nginx container, or as a
# conf.d file on a host. This file is loaded inside nginx's `http` context.

map $uri $waajacu_cache_control {
    # Asset filenames other than the catalog database are stable across app
    # releases, so they must revalidate after an atomic `current` switch.
    default                                      "no-cache";
    "~^/data/catalog-[0-9a-f]{64}\.sqlite3$"     "public, max-age=31536000, immutable";
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /srv/waajacu/current;
    index index.html;
    autoindex off;
    charset utf-8;
    etag on;

    # The database and WASM compress well. Fetch exposes decoded bytes to the
    # app, so its byte-length and SHA-256 verification still checks the exact
    # exported database.
    gzip on;
    # Prefer the exporter's verified .gz sidecar for the catalog database.
    # Deployments with ngx_brotli may additionally enable `brotli_static on`.
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/json application/octet-stream application/vnd.sqlite3 application/wasm text/css text/javascript;

    add_header Cache-Control $waajacu_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; child-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /catalog-manifest.json {
        types { application/json json; }
        try_files $uri =404;
    }

    # Keep this regex before all extension-based allow rules so a file beneath
    # a dot-directory cannot become public merely because it ends in .wasm,
    # .mjs, or another otherwise permitted suffix.
    location ~ /\. {
        return 404;
    }

    location ~ "^/data/catalog-[0-9a-f]{64}\.sqlite3$" {
        types { application/vnd.sqlite3 sqlite3; }
        try_files $uri =404;
    }

    # Fail closed for any database name not allowed by the public manifest
    # convention. The preceding regex is evaluated first.
    location ~ \.sqlite3$ {
        return 404;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location ~ \.(?:js|mjs)$ {
        types { text/javascript js mjs; }
        try_files $uri =404;
    }

    # Hash routes need no fallback. This fallback also permits clean routes
    # such as /minerals/quartz while static assets still fail with 404 above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
