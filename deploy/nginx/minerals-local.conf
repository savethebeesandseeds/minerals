# Complete nginx configuration for the local, containerized development site.
# The canonical root is also the Codex-annotatable page. Its narrow inline-style
# element exception is temporary development policy; scripts and style
# attributes remain strict.

worker_processes 2;
pid /tmp/minerals-nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;

    client_body_temp_path /tmp/minerals-nginx/client;
    proxy_temp_path /tmp/minerals-nginx/proxy;
    fastcgi_temp_path /tmp/minerals-nginx/fastcgi;
    uwsgi_temp_path /tmp/minerals-nginx/uwsgi;
    scgi_temp_path /tmp/minerals-nginx/scgi;

    map $uri $waajacu_local_cache_control {
        default                                          "no-cache";
        "/"                                              "no-store";
        "~\.(?:html|css|js|mjs|png|svg|webp)$"           "no-store";
        "~^/data/catalog-[0-9a-f]{64}\.sqlite3(?:\.(?:br|gz))?$"
                                                         "public, max-age=31536000, immutable";
    }

    # Retire URLs issued by the former review server without breaking the
    # atlas's documented ?route= query fallback.
    map $args $waajacu_drop_legacy_selector_query {
        default 0;
        "~*(^|&)selector[_-]review[_-]session=" 1;
    }

    server {
        listen 18965 default_server;
        server_name _;
        absolute_redirect off;

        root /runtime/current;
        index index.html;
        autoindex off;
        charset utf-8;
        etag on;

        gzip on;
        gzip_static on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types application/json application/octet-stream application/vnd.sqlite3 application/wasm text/css text/javascript;

        add_header Cache-Control $waajacu_local_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'none'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; child-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Origin-Agent-Cluster "?1" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), tools=(self)" always;

        location = / {
            # Keep the one canonical development URL clean.
            if ($waajacu_drop_legacy_selector_query) {
                return 302 /;
            }
            try_files /index.html =404;
        }

        location = /index.html {
            try_files $uri =404;
        }

        location ~ \.html$ {
            try_files $uri =404;
        }

        location = /healthz {
            access_log off;
            return 204;
        }

        location = /catalog-manifest.json {
            types { application/json json; }
            try_files $uri =404;
        }

        location ~ /\. {
            return 404;
        }

        location ~ "^/data/catalog-[0-9a-f]{64}\.sqlite3$" {
            types { application/vnd.sqlite3 sqlite3; }
            try_files $uri =404;
        }

        location ~ "^/data/catalog-[0-9a-f]{64}\.sqlite3\.(?:br|gz)$" {
            types {
                application/gzip gz;
                application/octet-stream br;
            }
            try_files $uri =404;
        }

        location ~ \.sqlite3(?:\.(?:br|gz))?$ {
            return 404;
        }

        location ~ \.wasm$ {
            types { application/wasm wasm; }
            try_files $uri =404;
        }

        location ~ \.(?:js|mjs)$ {
            types { text/javascript js mjs; }
            try_files $uri =404;
        }

        location ~ \.css$ {
            types { text/css css; }
            try_files $uri =404;
        }

        location ~ \.(?:png|ico|svg|webp|woff2)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
