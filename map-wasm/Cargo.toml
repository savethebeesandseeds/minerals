[package]
name = "minerals-map"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Keep the dependency-free WASM renderer independently buildable even though
# its directory lives below the native application's Cargo workspace.
[workspace]
resolver = "2"
