[workspace]
members = [
    ".",
    "crates/registry-core",
    "crates/public-catalog",
    "crates/ima-release",
]
default-members = ["."]
exclude = ["map-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
thiserror = "1.0"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
unicode-normalization = "0.1"
url = "2.5"

[package]
name = "minerals-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autolib = false
autobins = false

[[bin]]
name = "minerals"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
askama = "0.12"
axum = { version = "0.7", features = ["form", "json", "multipart"] }
base64 = "0.22"
getrandom.workspace = true
minerals = { package = "minerals-registry", path = "crates/registry-core" }
reqwest.workspace = true
ring.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile.workspace = true
