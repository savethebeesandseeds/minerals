name: Deploy main to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  prepare:
    name: Assemble and verify main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUSTUP_TOOLCHAIN: 1.96.0

    steps:
      - name: Require the default branch
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Deploy GitHub Pages only from the default branch." >&2
            exit 1
          fi

      - name: Check out the exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Node.js for publication validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enforce the public repository boundary
        run: python3 tools/check-public-boundary.py

      - name: Test repository publication tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest \
            tools/test_check_public_boundary.py \
            tools/test_verify_pages_live.py
          node --test tools/test_validate_public_catalog_sidecars.mjs

      - name: Install pinned Rust toolchain
        shell: bash
        run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          --profile minimal

      - name: Build the public release assembler
        run: >-
          cargo build --locked --release
          -p minerals-public-catalog --bin export-public

      - name: Keep live verification on the central app allowlist
        shell: bash
        run: |
          set -Eeuo pipefail
          diff -u \
            <(target/release/export-public --list-app-files) \
            <(python3 tools/verify-pages-live.py --list-app-files)

      - name: Assemble and validate the exact main snapshot
        run: >-
          target/release/export-public
          --assemble-catalog public-catalog
          --output "$RUNNER_TEMP/waajacu-pages-release"
          --app-root public-app

      - name: Test the assembled database and browser worker
        env:
          WAAJACU_CATALOG_SMOKE_DIR: ${{ runner.temp }}/waajacu-pages-release
        run: node --test public-app/tests.mjs

      - name: Refuse to publish a superseded main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha
          )"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; this run must not publish stale files." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload only the validated main snapshot
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/waajacu-pages-release

  deploy:
    name: Deploy GitHub Pages
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the validated main artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  verify:
    name: Verify live files match main
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Wait for the live site to match the commit
        run: >-
          python3 tools/verify-pages-live.py
          --base-url "${{ needs.deploy.outputs.page_url }}"
          --app-root public-app
          --catalog-root public-catalog
          --commit "$GITHUB_SHA"
          --timeout-seconds 900
