<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#e8ede8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; child-src 'self'; manifest-src 'self'; form-action 'self'"
    >
    <meta name="waajacu-map-module" content="./map/map-loader.js">
    <meta
      name="description"
      content="Browse Waajacu's verified public mineral catalog, evidence, and market offers."
    >
    <title>Waajacu's Minerals</title>
    <link rel="stylesheet" href="./app.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to main content</a>

    <header class="topbar site-header">
      <div class="topbar-inner">
        <a class="brand" href="#/" data-route-link aria-label="Minerals, home">
          <img
            src="./assets/logo_transparent.png"
            alt=""
            width="32"
            height="32"
            data-logo-light="./assets/logo_transparent.png"
            data-logo-dark="./assets/logo_transparent_dark.png"
          >
          <span>MINERALS</span>
        </a>

        <nav class="primary-nav" aria-label="Primary navigation">
          <a class="menu" href="#/" data-route-link data-nav="home">Home</a>
          <a class="menu" href="#/minerals" data-route-link data-nav="minerals">All Minerals</a>
          <a class="menu" href="#/map" data-route-link data-nav="map">Map</a>
          <a class="menu" href="#/about" data-route-link data-nav="about">About</a>
        </nav>

        <div class="top-tools">
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Change color theme" aria-pressed="false">
            <span aria-hidden="true">◐</span>
            <span class="visually-hidden" data-theme-label>Theme</span>
          </button>
        </div>
      </div>
    </header>

    <main id="app-main" tabindex="-1">
      <section class="loading-view" aria-labelledby="loading-title">
        <p class="eyebrow">Public catalog</p>
        <h1 id="loading-title">Opening the mineral collection…</h1>
        <p>The catalog is checked locally before it is displayed.</p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <nav class="footer-col-links" aria-label="Footer">
          <a href="#/" data-route-link data-nav-label="home">Home</a>
          <a href="#/minerals" data-route-link data-nav-label="minerals">All Minerals</a>
          <a href="#/map" data-route-link data-nav-label="map">Map</a>
          <a href="#/about" data-route-link data-nav-label="about">About</a>
        </nav>
        <div class="footer-meta">
          <p id="release-summary">Catalog release loading…</p>
          <p class="footer-note">powered trust by <a href="https://www.waajacu.com" target="_blank" rel="noopener noreferrer">www.waajacu.com</a></p>
        </div>
      </div>
    </footer>

    <div id="app-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
