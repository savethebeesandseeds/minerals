<!DOCTYPE html>
<html lang="{{ lang_code }}" dir="{{ lang_dir }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }} | Minerals</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/static/app.css" />
  <script src="/static/theme.js" defer></script>
</head>
<body>
  <nav class="topbar" aria-label="Main">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Minerals Home">
        <img
          src="/static/logo_transparent.png"
          alt="Minerals logo"
          data-logo-light="/static/logo_transparent.png"
          data-logo-dark="/static/logo_transparent_dark.png"
        />
        <span>MINERALS</span>
      </a>
      <a class="menu" href="/">{{ txt.nav_home }}</a>
      <a class="menu" href="/minerals">{{ txt.nav_all_minerals }}</a>
      <div class="top-tools">
        <a class="login-link" href="/admin">{% if has_admin_session %}admin{% else %}{{ txt.nav_login }}{% endif %}</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="{{ txt.registry.theme_toggle }}" aria-pressed="false">◐</button>
      </div>
    </div>
  </nav>

  <main class="page">
    <section class="hero">
      <h1>{{ page_title }}</h1>
      <p class="lead" style="max-width:68ch; margin-top:0.45rem;">
        {{ page_body }}
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-col-links" aria-label="Footer" style="display:flex; flex-wrap:wrap; gap:0.3rem 0.8rem;">
        <a href="/">{{ txt.nav_home }}</a>
        <a href="/minerals">{{ txt.nav_all_minerals }}</a>
        <a href="/about">{{ txt.footer_about_us }}</a>
      </nav>
      <p class="footer-note">{{ txt.footer_powered_trust_by }} <a href="https://www.waajacu.com" target="_blank" rel="noopener">www.waajacu.com</a></p>
    </div>
  </footer>
</body>
</html>
